name: Build ImageVeil tweak

on:
  push:
    paths:
      - "ImageVeil.c"
      - "ImageVeil.plist"
      - "deb-root/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Needs a real Xcode toolchain (iOS SDK) -- only macOS runners have one.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build arm64 dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using SDK: $SDK"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -Wall -Wextra \
            -o ImageVeil.dylib \
            ImageVeil.c

      - name: Ad-hoc codesign
        run: |
          codesign -s - --timestamp=none -f ImageVeil.dylib
          codesign -dv ImageVeil.dylib

      - name: Install dpkg-deb
        run: brew install dpkg

      - name: Assemble .deb package root
        run: |
          # ROOTLESS jailbreak (Dopamine/ElleKit): TweakInject loads tweaks
          # from /var/jb/usr/lib/TweakInject/ -- so the package MUST install
          # there, not /usr/lib/TweakInject/. Installing to the bare /usr path
          # succeeds silently but the dylib never gets injected.
          mkdir -p deb-root/var/jb/usr/lib/TweakInject
          cp ImageVeil.dylib deb-root/var/jb/usr/lib/TweakInject/
          # Generated inline (OpenStep-style filter plist, NOT XML plist --
          # TweakInject's loader expects the old Substrate `{ Filter = ...}`
          # format). Written here directly so the package is always correct
          # even if ImageVeil.plist is missing/stale in the checkout.
          printf '%s\n' '{ Filter = { Bundles = ( "com.cardify.tinder" ); }; }' \
            > deb-root/var/jb/usr/lib/TweakInject/ImageVeil.plist
          chmod 0755 deb-root/DEBIAN
          chmod 0644 deb-root/DEBIAN/control

      - name: Build .deb
        run: |
          dpkg-deb --build --root-owner-group deb-root com.duszan.imgveil_1.0_iphoneos-arm64.deb
          dpkg-deb --info com.duszan.imgveil_1.0_iphoneos-arm64.deb
          echo "---- contents ----"
          dpkg-deb --contents com.duszan.imgveil_1.0_iphoneos-arm64.deb
          echo "---- plist as packaged ----"
          dpkg-deb --fsys-tarfile com.duszan.imgveil_1.0_iphoneos-arm64.deb | tar -xO ./var/jb/usr/lib/TweakInject/ImageVeil.plist

      - name: Package raw dylib too (manual-copy fallback)
        run: |
          mkdir -p dist
          cp deb-root/var/jb/usr/lib/TweakInject/ImageVeil.dylib dist/
          cp deb-root/var/jb/usr/lib/TweakInject/ImageVeil.plist dist/
          cp com.duszan.imgveil_1.0_iphoneos-arm64.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageVeil-tweak
          path: dist/
