name: Build JBHide tweak

on:
  push:
    paths:
      - "JBHide.c"
      - "JBHide.plist"
      - "deb-root/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Needs a real Xcode toolchain (iOS SDK) -- only macOS runners have one.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build arm64 dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using SDK: $SDK"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -Wall -Wextra \
            -o JBHide.dylib \
            JBHide.c

      - name: Ad-hoc codesign
        run: |
          codesign -s - --timestamp=none -f JBHide.dylib
          codesign -dv JBHide.dylib

      - name: Install dpkg-deb
        run: brew install dpkg

      - name: Assemble .deb package root
        run: |
          mkdir -p deb-root/usr/lib/TweakInject
          cp JBHide.dylib deb-root/usr/lib/TweakInject/
          cp JBHide.plist deb-root/usr/lib/TweakInject/
          chmod 0755 deb-root/DEBIAN
          chmod 0644 deb-root/DEBIAN/control

      - name: Build .deb
        run: |
          dpkg-deb --build --root-owner-group deb-root com.duszan.jbhide_1.0_iphoneos-arm64.deb
          dpkg-deb --info com.duszan.jbhide_1.0_iphoneos-arm64.deb
          dpkg-deb --contents com.duszan.jbhide_1.0_iphoneos-arm64.deb

      - name: Package raw dylib too (manual-copy fallback)
        run: |
          mkdir -p dist
          cp JBHide.dylib dist/
          cp JBHide.plist dist/
          cp com.duszan.jbhide_1.0_iphoneos-arm64.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JBHide-tweak
          path: dist/
